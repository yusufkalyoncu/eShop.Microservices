services:
  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: catalogdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  identity-db:
    image: postgres:16-alpine
    container_name: eshop-identity-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: identitydb
    ports:
      - "5433:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identitydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  notification-db:
    image: postgres:16-alpine
    container_name: eshop-notification-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: notificationdb
    ports:
      - "5434:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notificationdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── Observability ───────────────────────────────────────────────────────────
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: eshop-aspire-dashboard
    ports:
      - "18888:18888"   # Aspire Dashboard UI — open http://localhost:18888 to view traces/metrics/logs
      - "14317:18889"   # Host → Aspire OTLP (optional, for debugging without Collector)
    environment:
      # SECURITY WARNING: Only for local/dev. Production does NOT use this container at all.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: eshop-otel-collector
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC — microservices send telemetry here
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - aspire-dashboard
    restart: unless-stopped
  # ─────────────────────────────────────────────────────────────────────────────

  gateway.api:
    image: eshop-gateway-api
    container_name: eshop-gateway-api
    build:
      context: .
      dockerfile: src/ApiGateways/Gateway.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Identity__Authority=http://keycloak:8080/realms/eShopRealm
      - Identity__Audience=eshop-gateway-client
      - Identity__ValidIssuers__0=http://keycloak:8080/realms/eShopRealm
      - Identity__ValidIssuers__1=http://localhost:9090/realms/eShopRealm
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog.api:8080
      - ReverseProxy__Clusters__basket-cluster__Destinations__destination1__Address=http://basket.api:8080
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity.api:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    ports:
      - "5050:8080"
    depends_on:
      catalog.api:
        condition: service_started
      basket.api:
        condition: service_started
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  catalog.api:
    image: eshop-catalog-api
    container_name: eshop-catalog-api
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Postgres__Host=postgres
      - Postgres__Port=5432
      - Postgres__Username=postgres
      - Postgres__Password=postgrespassword
      - Postgres__Database=catalogdb
      - Identity__Authority=http://keycloak:8080/realms/eShopRealm
      - Identity__Audience=eshop-gateway-client
      - Identity__ValidIssuers__0=http://keycloak:8080/realms/eShopRealm
      - Identity__ValidIssuers__1=http://localhost:9090/realms/eShopRealm
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: eshop-keycloak
    command: start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgrespassword
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    ports:
      - "9090:8080"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && echo -e \"GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n\" >&3 && head -n 1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  basket.api:
    image: eshop-basket-api
    container_name: eshop-basket-api
    build:
      context: .
      dockerfile: src/Services/Basket/Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Marten__Username=postgres
      - Marten__Password=postgrespassword
      - Marten__Host=postgres
      - Marten__Port=5432
      - Marten__Database=basketdb
      - GrpcSettings__CatalogUrl=http://catalog.api:8081
      - Identity__Authority=http://keycloak:8080/realms/eShopRealm
      - Identity__Audience=eshop-gateway-client
      - Identity__ValidIssuers__0=http://keycloak:8080/realms/eShopRealm
      - Identity__ValidIssuers__1=http://localhost:9090/realms/eShopRealm
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalog.api:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  identity.api:
    image: eshop-identity-api
    container_name: eshop-identity-api
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__Authority=http://keycloak:8080/realms/eShopRealm
      - Keycloak__Url=http://keycloak:8080
      - Keycloak__Realm=eShopRealm
      - Keycloak__ClientId=identity-api-client
      - Keycloak__ClientSecret=identity-api-secret
      - Identity__Authority=http://keycloak:8080/realms/eShopRealm
      - Identity__Audience=eshop-gateway-client
      - Postgres__Host=identity-db
      - Postgres__Port=5432
      - Postgres__Database=identitydb
      - Postgres__Username=postgres
      - Postgres__Password=postgrespassword
      - RabbitMq__Host=amqp://rabbitmq:5672
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    ports:
      - "8082:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  notification.api:
    image: eshop-notification-api
    container_name: eshop-notification-api
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Postgres__Host=notification-db
      - Postgres__Port=5432
      - Postgres__Database=notificationdb
      - Postgres__Username=postgres
      - Postgres__Password=postgrespassword
      - RabbitMq__Host=amqp://rabbitmq:5672
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    ports:
      - "8083:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  identity_db_data:
  notification_db_data:
  rabbitmq_data:
