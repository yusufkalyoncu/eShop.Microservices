services:
  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: catalogdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  gateway.api:
    image: eshop-gateway-api
    container_name: eshop-gateway-api
    build:
      context: .
      dockerfile: src/ApiGateways/Gateway.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Identity__Authority=http://keycloak:8080/realms/eShopRealm
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog.api:8080
      - ReverseProxy__Clusters__basket-cluster__Destinations__destination1__Address=http://basket.api:8080
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity.api:8080
    ports:
      - "5050:8080"
    depends_on:
      catalog.api:
        condition: service_started
      basket.api:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  catalog.api:
    image: eshop-catalog-api
    container_name: eshop-catalog-api
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Postgres__Host=postgres
      - Postgres__Port=5432
      - Postgres__Username=postgres
      - Postgres__Password=postgrespassword
      - Postgres__Database=catalogdb
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: eshop-keycloak
    command: start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgrespassword
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    ports:
      - "9090:8080"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && echo -e \"GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n\" >&3 && head -n 1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  basket.api:
    image: eshop-basket-api
    container_name: eshop-basket-api
    build:
      context: .
      dockerfile: src/Services/Basket/Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Marten__Username=postgres
      - Marten__Password=postgrespassword
      - Marten__Host=postgres
      - Marten__Port=5432
      - Marten__Database=basketdb
      - GrpcSettings__CatalogUrl=http://catalog.api:8081
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalog.api:
        condition: service_started
    restart: unless-stopped

  identity.api:
    image: eshop-identity-api
    container_name: eshop-identity-api
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__Authority=http://keycloak:8080/realms/eShopRealm
      - Keycloak__Url=http://keycloak:8080
      - Keycloak__Realm=eShopRealm
      - Keycloak__ClientId=identity-api-client
      - Keycloak__ClientSecret=identity-api-secret
      - Identity__Authority=http://keycloak:8080/realms/eShopRealm
      - Identity__Audience=eshop-gateway-client
    ports:
      - "8082:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
